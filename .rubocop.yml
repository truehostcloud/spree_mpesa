# RuboCop configuration. Permissive by design: it enforces security and core
# lint rules without imposing style churn, matching the other Truehost gems.

AllCops:
  DisabledByDefault: true
  TargetRubyVersion: 3.0
  NewCops: disable
  Exclude:
    - 'bin/**/*'
    - 'db/**/*'
    - 'config/**/*'
    - 'spec/**/*'
    - 'vendor/**/*'
    - 'tmp/**/*'
    - '**/*.gemspec'

Security/JSONLoad:
  Enabled: true

Security/MarshalLoad:
  Enabled: true

Security/Open:
  Enabled: true

Security/YAMLLoad:
  Enabled: true

Lint/DeprecatedClassMethods:
  Enabled: true

Lint/DuplicateMethods:
  Enabled: true

Lint/NonDeterministicRequireOrder:
  Enabled: true

Lint/OrderedMagicComments:
  Enabled: true

Lint/Syntax:
  Enabled: true

Lint/UselessAssignment:
  Enabled: true
